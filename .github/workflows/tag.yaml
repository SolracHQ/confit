name: tag

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(grep -m1 '^version' crates/cli/Cargo.toml | cut -d'"' -f2)"
          for crate in core engine cli; do
            other="$(grep -m1 '^version' "crates/$crate/Cargo.toml" | cut -d'"' -f2)"
            if [ "$other" != "$version" ]; then
              echo "Crate versions disagree, skipping tag."
              exit 0
            fi
          done
          tag="v$version"
          if git ls-remote --tags origin | grep -q "refs/tags/$tag$"; then
            echo "$tag already exists, skipping."
            exit 0
          fi
          git tag "$tag"
          git push origin "$tag"
