name: pages

on:
  push:
    branches:
      - main

permissions:
  pages: write
  id-token: write

jobs:
  book:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: latest
      - run: mdbook build docs/book
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/book/book
      - uses: actions/deploy-pages@v4
