[package]
name = "confit"
version = "0.2.0"
edition = "2024"

[dependencies]
anstream = "1.0.0"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.6", features = ["derive"] }
diffy = "0.5.2"
directories = "6.0.0"
fern = "0.7.1"
log = "0.4.34"
minijinja = "2.24.0"
mlua = { version = "0.12.1", features = ["lua54", "vendored"] }
noyalib = "0.0.43"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.20"
toml = "1.1.5"

[dev-dependencies]
tempfile = "3.27.0"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
