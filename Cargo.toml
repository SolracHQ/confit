[workspace]
resolver = "3"
members = ["crates/core", "crates/engine", "crates/cli"]

[workspace.dependencies]
anstream = "1.0.0"
clap = { version = "4.6.6", features = ["derive"] }
directories = "6.0.0"
log = "0.4.34"
minijinja = "2.24.0"
mlua = { version = "0.12.1", features = ["lua54", "vendored"] }
noyalib = "0.0.43"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tempfile = "3.27.0"
thiserror = "2.0.20"
toml = "1.1.5"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.dev.package."*"]
opt-level = 2
