[workspace]
resolver = "3"
members = [
  "crates/model",
  "crates/driver",
  "crates/engine",
  "crates/cli",
  "crates/store",
  "crates/runtime",
]

[workspace.dependencies]
anstream = "1.0.0"
clap = { version = "4.6.6", features = ["derive"] }
crossbeam-channel = "0.5.17"
diffy = "0.5.2"
dirs = "7.0.0"
flate2 = "1.1.10"
log = "0.4.34"
minijinja = "2.24.0"
mlua = { version = "0.12.1", features = ["lua54", "vendored"] }
noyalib = "0.0.51"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tar = "0.4.46"
tempfile = "3.27.0"
thiserror = "2.0.20"
toml = "1.1.5"
zip = "8.6.0"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.dev.package."*"]
opt-level = 2
