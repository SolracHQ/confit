[package]
name = "confit-binding-macros"
version = "0.9.0"
edition = "2024"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0.107"
quote = "1.0.47"
syn = { version = "3.0.7", features = ["full"] }

[lints]
workspace = true

[dev-dependencies]
confit-binding = { path = "../binding" }
mlua = { workspace = true, features = ["lua54", "vendored"] }
