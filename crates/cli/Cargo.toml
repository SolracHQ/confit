[package]
name = "confit-cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "confit"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
anstream.workspace = true
clap = { workspace = true, features = ["derive"] }
confit-runtime = { path = "../runtime" }
confit-model = { path = "../model" }
confit-engine = { path = "../engine" }
confit-store = { path = "../store" }
crossbeam-channel.workspace = true
diffy.workspace = true
fern = "0.7.1"
indicatif = "0.18.6"
log.workspace = true
serde_json.workspace = true
confit-driver = { path = "../driver" }
thiserror.workspace = true
minijinja = "3.0.0"
confit-core = { path = "../core" }
time = { workspace = true, features = ["local-offset"] }

[dev-dependencies]
confit-driver = { path = "../driver", features = ["test-support"] }
tempfile.workspace = true
