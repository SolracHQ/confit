[package]
name = "confit-cli"
version = "0.6.1"
edition = "2024"

[[bin]]
name = "confit"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
anstream.workspace = true
clap = { workspace = true, features = ["derive"] }
confit-core = { path = "../core" }
confit-engine = { path = "../engine" }
crossbeam-channel = "0.5.17"
dirs = "7.0.0"
fern = "0.7.1"
indicatif = "0.18.6"
log.workspace = true
rayon = "1.12.0"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

[dev-dependencies]
flate2 = "1.1.10"
tar = "0.4.46"
tempfile.workspace = true
