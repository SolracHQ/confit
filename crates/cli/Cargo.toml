[package]
name = "confit-cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "confit"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
clap = { workspace = true, features = ["derive"] }
confit-runtime.workspace = true
confit-model.workspace = true
confit-engine.workspace = true
confit-store.workspace = true
crossbeam-channel.workspace = true
fern = "0.7.1"
log.workspace = true
serde_json.workspace = true
confit-driver.workspace = true
thiserror.workspace = true
minijinja = "3.0.0"
confit-core.workspace = true
time = { workspace = true, features = ["local-offset"] }
confit-events.workspace = true
confit-bundler.workspace = true
confit-ui.workspace = true
confit-differ.workspace = true
serde.workspace = true

[dev-dependencies]
confit-driver = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
