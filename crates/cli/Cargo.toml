[package]
name = "confit-cli"
version = "0.8.0"
edition = "2024"

[[bin]]
name = "confit"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
anstream.workspace = true
clap = { workspace = true, features = ["derive"] }
confit-runtime = { path = "../runtime" }
confit-model = { path = "../model" }
confit-engine = { path = "../engine" }
confit-store = { path = "../store" }
crossbeam-channel = "0.5.17"
diffy = "0.5.2"
dirs = "7.0.0"
fern = "0.7.1"
indicatif = "0.18.6"
log.workspace = true
rayon = "1.12.0"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
confit-driver = { version = "0.8.0", path = "../driver" }

[dev-dependencies]
confit-driver = { path = "../driver", features = ["test-support"] }
flate2 = "1.1.10"
tar = "0.4.46"
tempfile.workspace = true
