[package]
name = "confit-engine"
version = "0.9.0"
edition = "2024"

[dependencies]
confit-driver = { version = "0.8.0", path = "../driver" }
confit-model = { version = "0.8.0", path = "../model" }
confit-store = { version = "0.8.0", path = "../store" }
confit-surface-api = { version = "0.9.0", path = "../surface-api" }
mlua = { workspace = true, features = ["lua54", "vendored"] }
thiserror.workspace = true

[lints]
workspace = true

[dev-dependencies]
confit-driver = { path = "../driver", features = ["test-support"] }
crossbeam-channel = "0.5.17"
tempfile.workspace = true
