[package]
name = "confit-engine"
version = "0.9.0"
edition = "2024"

[dependencies]
confit-binding = { version = "0.9.0", path = "../binding" }
confit-binding-macros = { version = "0.9.0", path = "../binding-macros" }
confit-driver = { version = "0.9.0", path = "../driver" }
confit-model = { version = "0.9.0", path = "../model" }
confit-store = { version = "0.9.0", path = "../store" }
log.workspace = true
minijinja = { version = "3.0.0", features = ["serde"] }
mlua = { workspace = true, features = ["lua54", "vendored"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true

[lints]
workspace = true

[dev-dependencies]
confit-driver = { version = "0.9.0", path = "../driver", features = ["test-support"] }
crossbeam-channel = "0.5.17"
tempfile.workspace = true
