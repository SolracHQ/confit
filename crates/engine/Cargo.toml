[package]
name = "confit-engine"
version = "0.8.0"
edition = "2024"

[lints]
workspace = true

[dependencies]
confit-core = { path = "../core" }
confit-store = { version = "0.8.0", path = "../store" }
log.workspace = true
minijinja.workspace = true
mlua = { workspace = true, features = ["lua54", "vendored"] }
mlua-extras = { version = "=12.0.0", features = ["lua54", "macros", "vendored"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true
