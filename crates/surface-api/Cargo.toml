[package]
name = "confit-surface-api"
version = "0.9.0"
edition = "2024"

[dependencies]
confit-model = { version = "0.8.0", path = "../model" }
confit-store = { version = "0.8.0", path = "../store" }
confit-surface-face = { version = "0.9.0", path = "../surface-face" }
file-format = { version = "0.29.0", features = ["reader-txt"] }
mlua = { workspace = true, features = ["lua54", "vendored"] }
mlua-extras = { version = "=12.0.0", features = ["lua54", "macros", "vendored"] }
noyalib.workspace = true
schemars = "1.2.2"
serde.workspace = true
serde_json.workspace = true
serde_path_to_error = "0.1.20"
serini = "0.3.0"
thiserror.workspace = true
toml.workspace = true

[lints]
workspace = true

[dev-dependencies]
confit-driver = { path = "../driver", features = ["test-support"] }
crossbeam-channel = "0.5.17"
tempfile.workspace = true
zip = "8.6.0"
