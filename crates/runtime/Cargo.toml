[package]
name = "confit-runtime"
version = "0.9.0"
edition = "2024"

[lints]
workspace = true

[dependencies]
confit-model = { version = "0.9.0", path = "../model" }
confit-driver = { version = "0.9.0", path = "../driver" }
confit-store = { version = "0.9.0", path = "../store" }
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
noyalib.workspace = true
crossbeam-channel.workspace = true
thiserror.workspace = true
log.workspace = true
diffy.workspace = true
confit-binding = { version = "0.9.0", path = "../binding" }
confit-binding-macros = { version = "0.9.0", path = "../binding-macros" }
mlua = { workspace = true, features = ["lua54", "vendored"] }
sha2.workspace = true
confit-core = { version = "0.9.0", path = "../core" }

[dev-dependencies]
confit-driver = { version = "0.9.0", path = "../driver", features = ["test-support"] }
tempfile.workspace = true
