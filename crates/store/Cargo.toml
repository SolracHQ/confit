[package]
name = "confit-store"
version = "0.9.0"
edition = "2024"

[lints]
workspace = true

[dependencies]
confit-driver = { version = "0.9.0", path = "../driver" }
mlua = { workspace = true, features = ["lua54", "vendored"] }
sha2.workspace = true
thiserror.workspace = true
serde.workspace = true
confit-binding = { version = "0.9.0", path = "../binding" }
confit-binding-macros = { version = "0.9.0", path = "../binding-macros" }
file-format = { version = "0.29.0", features = ["reader-txt"] }
serde_json.workspace = true
toml.workspace = true
noyalib.workspace = true
serini = "0.3.0"
bytemuck = { version = "1.25.2", features = ["derive"] }

[dev-dependencies]
confit-driver = { version = "0.9.0", path = "../driver", features = ["test-support"] }
crossbeam-channel = "0.5.17"
flate2.workspace = true
tar.workspace = true
tempfile.workspace = true
zip.workspace = true
